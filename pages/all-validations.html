<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todas las Validaciones - PAC 123</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: "Inter", sans-serif;
      background-color: #f8f9fa;
    }

    .group-header-button {
      transition: background-color 0.2s ease-in-out;
    }

    .group-content {
      transition: max-height 0.4s ease-in-out, opacity 0.3s ease-in-out;
      overflow: hidden;
    }

    .group-content.collapsed {
      max-height: 0 !important;
      opacity: 0;
      padding: 0 !important;
    }
  </style>
</head>

<body>
  <nav class="sidebar">
    <div class="logo-section">
      <img src="../img/laiw_color.png" alt="LAIW Logo" />
    </div>
    <ul class="nav flex-column flex-grow-1">
      <li class="nav-item">
        <a class="nav-link" aria-current="page" href="index.html">
          <i class="fas fa-home"></i>
          <span class="link-text">Inicio</span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link active" href="pac-list.html">
          <i class="fas fa-file-alt"></i>
          <span class="link-text">PACs</span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="activity.html">
          <i class="fas fa-chart-line"></i>
          <span class="link-text">Actividad</span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="customers.html">
          <i class="fas fa-users"></i>
          <span class="link-text">Clientes</span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" aria-current="page" href="documentation.html">
          <i class="fas fa-book"></i>
          <span class="link-text">Documentación</span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="chatbot.html">
          <i class="fas fa-robot"></i>
          <span class="link-text">Asistente</span>
        </a>
      </li>
    </ul>
    <ul class="nav flex-column mt-auto mb-3">
      <li class="nav-item">
        <a class="nav-link" href="#">
          <i class="fas fa-cog"></i>
          <span class="link-text">Configuración</span>
        </a>
      </li>
    </ul>
  </nav>

  <div class="main-content">
    <nav class="top-nav">
      <div class="d-flex align-items-center">
        <span class="navbar-brand ms-2">Validaciones de PAC 123</span>
      </div>
      <div class="nav-icons d-flex align-items-center">
        <a href="#" title="Notifications"><i class="fas fa-bell"></i></a>
        <a href="#" title="User Profile"><i class="fas fa-user-circle"></i></a>
      </div>
    </nav>
    <div class="content-wrapper pt-0 px-0">
      <div class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-6 py-4">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-4">
              <a href="javascript:history.back()" class="text-gray-600 hover:text-gray-800 transition-colors">
                <i class="fas fa-arrow-left text-lg"></i>
              </a>
              <div>
                <h1 class="text-2xl font-bold text-gray-900">
                  Todas las Validaciones
                </h1>
                <p class="text-gray-600 mt-1">
                  Formulario: Solicitud Única PAC 2025 (123)
                </p>
              </div>
            </div>
            <div class="flex items-center gap-3">
              <button id="expand-all-btn" class="btn btn-outline-secondary text-sm">
                <i class="fas fa-expand-arrows-alt mr-2"></i>Expandir Todo
              </button>
              <button id="collapse-all-btn" class="btn btn-outline-secondary text-sm">
                <i class="fas fa-compress-arrows-alt mr-2"></i>Contraer Todo
              </button>
              <a href="pac-edit.html" class="btn btn-primary">
                <i class="fas fa-edit mr-2"></i>
                Editar el Formulario
              </a>
            </div>
          </div>
        </div>
      </div>

      <div class="max-w-7xl mx-auto px-6 py-6">
        <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200 mb-6">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
            <div>
              <label for="search" class="block text-sm font-medium text-gray-700 mb-1">Buscar</label>
              <div class="relative">
                <input id="search" type="text" placeholder="Buscar validaciones..."
                  class="w-full pl-9 pr-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500"
                  disabled>
                <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
              </div>
            </div>
            <div>
              <label for="typeFilter" class="block text-sm font-medium text-gray-700 mb-1">Tipo</label>
              <select id="typeFilter" class="w-full px-3 py-2 border border-gray-300 rounded-md" disabled>
                <option value="all">Todos</option>
                <option value="error">Errores</option>
                <option value="warning">Incidencias</option>
                <option value="info">Avisos</option>
              </select>
            </div>
            <div>
              <label for="statusFilter" class="block text-sm font-medium text-gray-700 mb-1">Estado</label>
              <select id="statusFilter" class="w-full px-3 py-2 border border-gray-300 rounded-md" disabled>
                <option value="all">Todos</option>
                <option value="failed">Fallidas</option>
                <option value="passed">Exitosas</option>
              </select>
            </div>
          </div>
          <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
            <div class="bg-gray-50 p-3 rounded-lg text-center">
              <div class="text-2xl font-bold text-gray-700">21</div>
              <div class="text-xs text-gray-500">Total</div>
            </div>
            <div class="bg-red-50 p-3 rounded-lg text-center">
              <div class="text-2xl font-bold text-red-600">6</div>
              <div class="text-xs text-red-500">Fallidas</div>
            </div>
            <div class="bg-green-50 p-3 rounded-lg text-center">
              <div class="text-2xl font-bold text-green-600">15</div>
              <div class="text-xs text-green-500">Exitosas</div>
            </div>
            <div class="bg-red-50 p-3 rounded-lg text-center">
              <div class="text-2xl font-bold text-red-600">4</div>
              <div class="text-xs text-red-500">Errores</div>
            </div>
            <div class="bg-yellow-50 p-3 rounded-lg text-center">
              <div class="text-2xl font-bold text-yellow-600">1</div>
              <div class="text-xs text-yellow-500">Incidencias</div>
            </div>
          </div>
        </div>
        <div id="all-validations-container" class="space-y-8">
        </div>
      </div>
    </div>
  </div>

  <script>
    const mockValidationsData = [
      // Grupo: Campos del Formulario
      { group: 'fields', name: "Autorización comunicación por SMS", display_message: "Se recomienda autorizar la comunicación por SMS", severity: "info", failed: true, involved_fields: { field_data: [{ field_id: "com_sms" }] } },
      { group: 'fields', name: "Autorización comunicación por correo", display_message: "Se recomienda autorizar la comunicación por correo electrónico", severity: "info", failed: true, involved_fields: { field_data: [{ field_id: "com_email" }] } },
      { group: 'fields', name: "El teléfono móvil debe tener 9 dígitos", display_message: "Validación correcta", severity: "success", failed: false, involved_fields: { field_data: [] } },
      { group: 'fields', name: "Completitud de datos básicos del solicitante", display_message: "Domicilio de notificaciones es un campo obligatorio.", severity: "error", failed: true, involved_fields: { field_data: [{ field_id: "not_nombre_via" }] } },
      { group: 'fields', name: "IBAN del solicitante válido", display_message: "El formato del IBAN (ES123456789) no es válido.", severity: "error", failed: true, involved_fields: { field_data: [{ field_id: "iban" }] } },
      { group: 'fields', name: "Tipo de persona (física/jurídica) es obligatorio", display_message: "Validación correcta", severity: "success", failed: false, involved_fields: { field_data: [] } },
      { group: 'fields', name: "Validación de Código de Explotación Agraria (CEA) y REA", display_message: "Código de Explotación Agraria (CEA) no informado. Verificar si es obligatorio para este caso.", severity: "warning", failed: true, involved_fields: { field_data: [{ field_id: "cod_explotacion" }] } },
      { group: 'fields', name: "Validación de ayuda a jóvenes agricultores", display_message: "Validación correcta", severity: "success", failed: false, involved_fields: { field_data: [] } },
      { group: 'fields', name: "Datos de entidad colaboradora", display_message: "Validación correcta", severity: "success", failed: false, involved_fields: { field_data: [] } },
      { group: 'fields', name: "Verificación de Agricultor Activo (RD 1048/2022)", display_message: "Validación correcta", severity: "success", failed: false, involved_fields: { field_data: [] } },
      { group: 'fields', name: "Verificación de requisitos de ayudas asociadas agrícolas", display_message: "Validación correcta", severity: "success", failed: false, involved_fields: { field_data: [] } },
      { group: 'fields', name: "Validación de NIF/CIF del solicitante", display_message: "Validación correcta", severity: "success", failed: false, involved_fields: { field_data: [] } },

      // Grupo: Subvenciones Solicitadas
      { group: 'grants_solicita', name: "Verificación de requisitos para la ayuda de pastoreo extensivo", display_message: "PASTOREO EXTENSIVO - INCUMPLE. Recintos con pastos válidos: 0 | Carga ganadera: Sin superficie de pastos. ERRORES: No se han declarado recintos válidos para pastoreo extensivo.", severity: "error", failed: true, involved_fields: { field_data: [{ field_id: "eco_pastoreo_extensivo" }] } },
      { group: 'grants_solicita', name: "Verificación de requisitos para la ayuda de siega sostenible", display_message: "SIEGA SOSTENIBLE - No solicitada - NO ELEGIBLE. MOTIVOS: No se han declarado recintos válidos para siega sostenible.", severity: "success", failed: false, involved_fields: { field_data: [] } },
      { group: 'grants_solicita', name: "Verificación de requisitos para la ayuda de Islas de biodiversidad en pastos", display_message: "ISLAS DE BIODIVERSIDAD EN PASTOS - No solicitada - NO ELEGIBLE. MOTIVOS: No se han declarado recintos válidos para islas de biodiversidad.", severity: "success", failed: false, involved_fields: { field_data: [] } },
      { group: 'grants_solicita', name: "Verificación de requisitos para la ayuda de Siembra directa", display_message: "SIEMBRA DIRECTA - No solicitada - NO ELEGIBLE. MOTIVOS: No se han declarado recintos con productos de Tierras de Cultivo compatibles.", severity: "success", failed: false, involved_fields: { field_data: [] } },
      { group: 'grants_solicita', name: "Verificación de requisitos para la ayuda de Espacios de biodiversidad en cultivos", display_message: "ESPACIOS DE BIODIVERSIDAD - INCUMPLE. ERRORES: No se han declarado recintos válidos para espacios de biodiversidad (TC, CBA o CP).", severity: "error", failed: true, involved_fields: { field_data: [{ field_id: "eco_espacios_biodiversidad" }] } },
      { group: 'grants_solicita', name: "Verificación de requisitos para la ayuda de Rotación de cultivos con especies mejorantes", display_message: "ROTACIÓN ESPECIES MEJORANTES - INCUMPLE: No se han declarado recintos con productos de Tierras de Cultivo compatibles.", severity: "error", failed: true, involved_fields: { field_data: [{ field_id: "eco_rotacion_mejorantes" }] } },

      // Grupo: BCAM
      { group: 'BCAM', name: "Verificación del cumplimiento de BCAM 2 (Protección de humedales y turberas)", display_message: "BCAM 2: No aplica - sin recintos en zonas de humedales o turberas.", severity: "success", failed: false, involved_fields: { field_data: [] } },
      { group: 'BCAM', name: "Verificación del cumplimiento de BCAM 9 (Prohibición de convertir o arar pastos)", display_message: "BCAM 9: Sin recintos declarados - no aplica la validación.", severity: "success", failed: false, involved_fields: { field_data: [] } },
      {
        group: 'BCAM', name: "Verificación del cumplimiento de BCAM 7 (Rotación de cultivos y/o Diversificación)",
        display_message: "CUMPLE BCAM 7. La explotación no está exenta de la BCAM 7. Rotación: No evaluado (faltan datos de años anteriores) | Diversificación: CUMPLE: 5 cultivos. Principal: 49.53%, 2 Principales: 81.36%.", severity: "success", failed: false, involved_fields: { field_data: [] }
      }
    ];

    const groupDetails = {
      fields: { title: "Campos del Formulario", icon: "fas fa-list" },
      grants_solicita: { title: "Subvenciones Solicitadas", icon: "fas fa-hand-holding-usd" },
      BCAM: { title: "BCAM", icon: "fas fa-database" }
    };

    const typeToColorAll = {
      error: { border: "border-red-400", bg: "bg-red-50", text: "text-red-700", icon: "fas fa-times-circle text-red-500", label: "Error", badgeClass: "bg-red-100 text-red-800" },
      warning: { border: "border-yellow-400", bg: "bg-yellow-50", text: "text-yellow-700", icon: "fas fa-exclamation-triangle text-yellow-500", label: "Incidencia", badgeClass: "bg-yellow-100 text-yellow-800" },
      info: { border: "border-blue-400", bg: "bg-blue-50", text: "text-blue-700", icon: "fas fa-info-circle text-blue-500", label: "Aviso", badgeClass: "bg-blue-100 text-blue-800" },
      success: { border: "border-green-400", bg: "bg-green-50", text: "text-green-700", icon: "fas fa-check-circle text-green-500", label: "Exitosa", badgeClass: "bg-green-100 text-green-800" }
    };

    function renderAllValidations() {
      const container = document.getElementById('all-validations-container');
      if (!container) return;
      container.innerHTML = '';

      // Agrupar validaciones
      const groupedValidations = mockValidationsData.reduce((acc, validation) => {
        const groupKey = validation.group;
        if (!acc[groupKey]) {
          acc[groupKey] = [];
        }
        acc[groupKey].push(validation);
        return acc;
      }, {});

      // Renderizar cada grupo
      for (const groupKey in groupedValidations) {
        const validations = groupedValidations[groupKey];
        const groupInfo = groupDetails[groupKey] || { title: groupKey, icon: 'fas fa-question-circle' };
        const isExpanded = true; // Por defecto expandidos

        const groupHTML = `
                <div class="bg-white rounded-lg shadow-sm border border-gray-200" data-group-key="${groupKey}">
                    <div class="bg-gray-50 px-6 py-4 border-b border-gray-200 rounded-t-lg">
                        <button class="group-header-button flex items-center gap-3 hover:bg-gray-100 rounded-lg px-3 py-2 -mx-3 -my-2 transition-colors w-full text-left">
                            <i class="chevron-icon fas fa-chevron-down text-gray-500 text-sm transition-transform duration-200"></i>
                            <i class="${groupInfo.icon} text-blue-600 text-lg"></i>
                            <h2 class="text-xl font-semibold text-gray-900">${groupInfo.title}</h2>
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800">
                                ${validations.length} validaciones
                            </span>
                        </button>
                    </div>
                    <div class="group-content p-6 space-y-4">
                        ${validations.map(validation => getValidationCardHTML(validation)).join('')}
                    </div>
                </div>`;
        container.insertAdjacentHTML('beforeend', groupHTML);
      }
    }

    function getValidationCardHTML(validation) {
      const color = !validation.failed ? typeToColorAll.success : (typeToColorAll[validation.severity] || typeToColorAll.info);
      const firstField = validation.involved_fields?.field_data?.[0];

      return `
        <div class="rounded-lg border ${color.border} ${color.bg} p-4">
          <div class="flex items-start gap-3">
            <i class="${color.icon} mt-1 text-lg"></i>
            <div class="flex-1">
              <div class="flex items-center justify-between mb-2">
                <div class="flex items-center gap-2">
                  ${color.label === 'Exitosa' ? '' : '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium' + color.badgeClass + '">' + color.label + '</span>'}
                  <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${!validation.failed ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">${!validation.failed ? 'Exitosa' : 'Fallida'}</span>
                </div>
                ${firstField ? `<a href="pac-edit.html" class="text-blue-600 hover:text-blue-800 underline text-sm font-medium">Ir al formulario</a>` : ''}
              </div>
              <h3 class="font-semibold ${color.text} mb-1">${validation.name}</h3>
              <p class="text-sm ${color.text}">${validation.display_message}</p>
            </div>
          </div>
        </div>`;
    }

    function setupEventListeners() {
      const container = document.getElementById('all-validations-container');
      if (!container) return;

      container.addEventListener('click', function (event) {
        const headerButton = event.target.closest('.group-header-button');
        if (headerButton) {
          const groupElement = headerButton.closest('[data-group-key]');
          const content = groupElement.querySelector('.group-content');
          const icon = headerButton.querySelector('.chevron-icon');
          content.classList.toggle('collapsed');
          icon.classList.toggle('fa-chevron-down');
          icon.classList.toggle('fa-chevron-right');
        }
      });

      document.getElementById('expand-all-btn').addEventListener('click', () => toggleAllGroups(true));
      document.getElementById('collapse-all-btn').addEventListener('click', () => toggleAllGroups(false));
    }

    function toggleAllGroups(expand) {
      document.querySelectorAll('[data-group-key]').forEach(groupElement => {
        const content = groupElement.querySelector('.group-content');
        const icon = groupElement.querySelector('.chevron-icon');
        if (expand) {
          content.classList.remove('collapsed');
          icon.classList.remove('fa-chevron-right');
          icon.classList.add('fa-chevron-down');
        } else {
          content.classList.add('collapsed');
          icon.classList.remove('fa-chevron-down');
          icon.classList.add('fa-chevron-right');
        }
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderAllValidations();
      setupEventListeners();
      toggleAllGroups(false); // Contraer todos al inicio
      document.querySelector('[data-group-key="fields"] .group-header-button').click(); // Expandir el primero
    });
  </script>

</body>

</html>
