  <div class="main-content">

    <div class="content-wrapper">
      <div class="container-fluid">
        <div class="row mb-3 align-items-center">
          <div class="col-md-12">
            <h1 class="h3 mb-0">Actividad Reciente</h1>
          </div>
        </div>

        <div class="card mb-4">
          <div class="card-body">
            <form class="row g-3 align-items-end">
              <div class="col-md-3">
                <label for="filterDateRange" class="form-label">Rango de Fechas</label>
                <div class="input-group">
                  <input type="date" class="form-control form-control-sm" id="filterDateStart">
                  <span class="input-group-text">-</span>
                  <input type="date" class="form-control form-control-sm" id="filterDateEnd">
                </div>
              </div>
              <div class="col-md-3">
                <label for="filterActivityType" class="form-label">Tipo de Actividad</label>
                <select id="filterActivityType" class="form-select form-select-sm">
                  <option selected disabled value="">Todos los tipos</option>
                  <option value="creacion">Creación</option>
                  <option value="modificacion">Modificación</option>
                  <option value="eliminacion">Eliminación</option>
                  <option value="subida">Subida de Archivo</option>
                  <option value="envio">Envío</option>
                  <option value="sistema">Sistema</option>
                </select>
              </div>
              <div class="col-md-2">
                <label for="filterUser" class="form-label">Usuario</label>
                <input type="text" class="form-control form-control-sm" id="filterUser"
                  placeholder="Nombre de usuario...">
              </div>
              <div class="col-md-2">
                <label for="searchActivity" class="form-label">Buscar en Detalles</label>
                <input type="text" class="form-control form-control-sm" id="searchActivity"
                  placeholder="Palabra clave...">
              </div>
              <div class="col-md-2">
                <button type="submit" class="btn btn-secondary btn-sm w-100"><i
                    class="fas fa-filter me-2"></i>Filtrar</button>
              </div>
            </form>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <i class="fas fa-stream me-2"></i>Flujo de Actividad
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                  <tr>
                    <th scope="col" class="text-center" style="width: 5%;"></th>
                    <th scope="col" style="width: 20%;">Acción</th>
                    <th scope="col" style="width: 25%;">Entidad Afectada</th>
                    <th scope="col" style="width: 15%;">Usuario</th>
                    <th scope="col" style="width: 15%;">Fecha y Hora</th>
                    <th scope="col" style="width: 20%;">Detalles Adicionales</th>
                  </tr>
                </thead>
                <tbody id="activityTableBody">
                  <tr>
                    <td colspan="6" class="text-center p-4">
                      <div class="spinner-border spinner-border-sm" style="color: #1abc9c" role="status">
                        <span class="visually-hidden">Cargando...</span>
                      </div>
                      <span class="ms-2">Cargando actividad...</span>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
          <div class="card-footer bg-light">
            <nav aria-label="Paginación de Actividad">
              <ul class="pagination justify-content-center mb-0" id="activityPagination">
              </ul>
            </nav>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <script>
    const fullActivityData = [
      { icon: "fas fa-user-plus text-success", action: "Nuevo cliente creado", entity: "Agricultor Moderno S.L.", entityLink: "customer-details.html?id=USR004", user: "Ana López", timestamp: "2025-05-13 10:30:00", details: "Cliente dado de alta a través del formulario web." },
      { icon: "fas fa-file-upload text-primary", action: "PAC Subida", entity: "PAC2025-001 (Juan Pérez Gómez)", entityLink: "pac-details.html?id=PAC2025-001", user: "Carlos Ruiz", timestamp: "2025-05-13 09:45:00", details: "Documentación inicial de la PAC 2025 subida al sistema." },
      { icon: "fas fa-edit text-warning", action: "PAC Modificada", entity: "PAC2025-002 (Agropecuaria La Esperanza S.L.)", entityLink: "pac-details.html?id=PAC2025-002", user: "Laura Martín", timestamp: "2025-05-13 08:15:30", details: "Actualización de datos catastrales y superficies." },
      { icon: "fas fa-file-signature text-info", action: "Contrato Firmado", entity: "Contrato PAC 2025 - USR001 (Juan Pérez Gómez)", entityLink: "#", user: "Ana López", timestamp: "2025-05-12 17:00:00", details: "Contrato de servicios para la tramitación de la PAC 2025 firmado digitalmente." },
      { icon: "fas fa-user-cog text-secondary", action: "Permisos de Usuario Actualizados", entity: "Carlos Ruiz (Gestor)", entityLink: "#", user: "Admin Sistema", timestamp: "2025-05-12 15:20:00", details: "Rol asignado: Gestor Senior de PACs." },
      { icon: "fas fa-paper-plane text-primary", action: "PAC Enviada a SGA", entity: "PAC2024-005 (Juan Pérez Gómez)", entityLink: "pac-details.html?id=PAC2024-005", user: "Sistema Automático", timestamp: "2025-05-11 10:00:00", details: "La solicitud PAC2024-005 fue enviada exitosamente a la plataforma SGA." },
      { icon: "fas fa-file-excel text-success", action: "Importación de Datos Completada", entity: "Recintos SIGPAC Campaña 2025", entityLink: "#", user: "Admin Sistema", timestamp: "2025-05-10 18:00:00", details: "Se importaron 15,720 nuevos registros de recintos SIGPAC." },
      { icon: "fas fa-trash text-danger", action: "Documento Eliminado", entity: "Borrador_SIGPAC_parcela_ABC.pdf (PAC2025-003)", entityLink: "pac-details.html?id=PAC2025-003", user: "Laura Martín", timestamp: "2025-05-09 12:00:00", details: "Documento eliminado por duplicidad." },
      { icon: "fas fa-comment-dots text-info", action: "Nuevo Comentario en PAC", entity: "PAC2025-001", entityLink: "pac-details.html?id=PAC2025-001#comentarios", user: "Juan Pérez Gómez", timestamp: "2025-05-09 11:30:00", details: "Consulta sobre la ayuda a jóvenes agricultores." },
      { icon: "fas fa-user-check text-success", action: "Cliente Verificado", entity: "Nuevos Clientes Lote Mayo", entityLink: "customers.html?filter=verificados_mayo", user: "Sistema Automático", timestamp: "2025-05-09 09:00:00", details: "Verificación de NIF completada para 5 nuevos clientes." }
    ];

    // Simulación de paginación
    const itemsPerPage = 7; // Mostrar menos para probar paginación
    let currentPage = 1;

    function displayActivity(page = 1, data = fullActivityData) {
      currentPage = page;
      const tableBody = document.getElementById("activityTableBody");
      tableBody.innerHTML = ""; // Limpiar contenido anterior o spinner

      if (data.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="6" class="text-center p-4"><em class="text-muted">No hay actividad que coincida con los filtros.</em></td></tr>`;
        renderPagination(0);
        return;
      }

      const startIndex = (page - 1) * itemsPerPage;
      const endIndex = startIndex + itemsPerPage;
      const paginatedItems = data.slice(startIndex, endIndex);

      paginatedItems.forEach(item => {
        const row = document.createElement("tr");
        // Formatear timestamp
        const date = new Date(item.timestamp);
        const formattedDate = `${date.toLocaleDateString('es-ES')} ${date.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })}`;

        row.innerHTML = `
          <td class="text-center"><i class="${item.icon} fs-5"></i></td>
          <td>${item.action}</td>
          <td><a href="${item.entityLink || '#'}">${item.entity}</a></td>
          <td>${item.user}</td>
          <td>${formattedDate}</td>
          <td class="small">${item.details || ''}</td>
        `;
        tableBody.appendChild(row);
      });
      renderPagination(data.length);
    }

    function renderPagination(totalItems) {
      const paginationUl = document.getElementById("activityPagination");
      paginationUl.innerHTML = "";
      const totalPages = Math.ceil(totalItems / itemsPerPage);

      if (totalPages <= 1) return; // No mostrar paginación si hay 1 o 0 páginas

      // Botón Anterior
      const prevLi = document.createElement("li");
      prevLi.className = `page-item ${currentPage === 1 ? 'disabled' : ''}`;
      prevLi.innerHTML = `<a class="page-link" href="#" data-page="${currentPage - 1}">Anterior</a>`;
      paginationUl.appendChild(prevLi);

      // Números de Página (simplificado, podrías añadir lógica para '...')
      for (let i = 1; i <= totalPages; i++) {
        const pageLi = document.createElement("li");
        pageLi.className = `page-item ${i === currentPage ? 'active' : ''}`;
        pageLi.innerHTML = `<a class="page-link" href="#" data-page="${i}">${i}</a>`;
        paginationUl.appendChild(pageLi);
      }

      // Botón Siguiente
      const nextLi = document.createElement("li");
      nextLi.className = `page-item ${currentPage === totalPages ? 'disabled' : ''}`;
      nextLi.innerHTML = `<a class="page-link" href="#" data-page="${currentPage + 1}">Siguiente</a>`;
      paginationUl.appendChild(nextLi);

      // Añadir event listeners a los links de paginación
      paginationUl.querySelectorAll(".page-link").forEach(link => {
        link.addEventListener("click", function (event) {
          event.preventDefault();
          const page = parseInt(this.getAttribute("data-page"));
          if (page && page !== currentPage) {
            // Aquí normalmente filtrarías los datos y luego llamarías a displayActivity
            // Por ahora, solo cambiamos de página con los datos completos
            displayActivity(page, fullActivityData);
          }
        });
      });
    }

    document.addEventListener("DOMContentLoaded", function () {
      // Carga inicial
      setTimeout(() => { // Simular pequeña demora de carga
        displayActivity(1, fullActivityData);
      }, 500);

      // Aquí iría la lógica para aplicar filtros y recargar la tabla con displayActivity(1, filteredData);
      document.querySelector('form.row.g-3').addEventListener('submit', function (event) {
        event.preventDefault();
        // Lógica de filtrado de 'fullActivityData' basada en los inputs
        // const filteredData = ...;
        // displayActivity(1, filteredData);
        alert('Filtrado aún no implementado en este mockup.');
      });
    });
  </script>
